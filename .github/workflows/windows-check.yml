name: Windows check

# Runs the Windows installer (setup.bat) and then windows/check.py on one of GitHub's Windows machines.
# Those machines have no graphics card, so this shows that the app installs, starts and does everything that
# needs none: the pages, LilyPond, turning a score into an audio file, joining clips, starting the engine,
# downloading a model file from Hugging Face and stopping a download.
# It cannot show that pictures and videos get made.
on:
  push:
    branches: [windows-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Install and try the app on Windows (no graphics card)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      STORYBOARD_NO_PAUSE: "1"     # setup.bat does not wait for a key at the end
      STORYBOARD_NO_BROWSER: "1"   # the app does not open a browser window
    defaults:
      run:
        # A folder name like the ones on real computers: spaces, brackets and an accent.
        working-directory: "Penguin Movie Studio (café)"
    steps:
      - uses: actions/checkout@v7
        with:
          path: "Penguin Movie Studio (café)"

      - name: What this machine has
        shell: powershell
        run: |
          "Windows PowerShell " + $PSVersionTable.PSVersion.ToString()
          (Get-CimInstance Win32_OperatingSystem).Caption
          foreach ($c in "winget", "choco", "git", "ffmpeg", "uv", "ollama", "python", "curl.exe", "tar") {
            $found = Get-Command $c -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { "{0,-9} {1}" -f $c, $found.Source } else { "{0,-9} -" -f $c }
          }

      # A home PC has winget and setup installs everything with it. GitHub's machines may not have it.
      - name: Stand in for winget where this machine has none
        shell: powershell
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) { "winget is here: setup installs everything itself."; exit 0 }
          "No winget on this machine: putting in place what setup would have installed with it."
          choco install ffmpeg -y --no-progress
          python -m pip install --quiet uv
          # Ollama only has to be found: this check writes no scripts. A stand-in saves a download of over a gigabyte.
          $bin = Join-Path $env:RUNNER_TEMP "standins"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Set-Content -Path (Join-Path $bin "ollama.cmd") -Value "@echo ollama stand-in for the check" -Encoding Ascii
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Run setup.bat
        shell: cmd
        run: call setup.bat -Yes -NoQuestions -Claude -Gguf

      - name: Run setup.bat again, only checking
        shell: cmd
        run: call setup.bat -Check -NoQuestions

      - name: Try the app (windows/check.py)
        shell: cmd
        run: ComfyUI\.venv\Scripts\python.exe windows\check.py --engine --claude --ollama --gguf --download

      - name: Start the app the way a person does (Start Storyboard.bat)
        shell: powershell
        env:
          STORYBOARD_PORT: "8791"
          COMFY_URL: "http://127.0.0.1:8198"
          COMFY_EXTRA_ARGS: "--cpu"
        run: |
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList '/c', '"Start Storyboard.bat"' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8791/api/state" -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          & taskkill /PID $p.Id /T /F | Out-Null
          if (-not $ok) {
            "The app did not answer within 3 minutes."
            Get-Content "storyboard\data\app.log" -Tail 40 -ErrorAction SilentlyContinue
            exit 1
          }
          "Start Storyboard.bat started the app, and it answered."
          exit 0

      - name: Keep what the app wrote, if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-check-logs
          path: "Penguin Movie Studio (café)/storyboard/data/*.log"
          if-no-files-found: ignore
